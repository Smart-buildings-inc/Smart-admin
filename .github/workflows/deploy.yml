name: Deploy

# Smart cloud automation: ship ATLAS OS to Vercel production.
#
# This runs ONLY after the "CI" workflow finishes successfully on `main`
# (typecheck + lint + build + the full Playwright matrix all green), so we
# never promote a red build. The Vercel CLI prebuilt flow keeps the build
# reproducible in CI rather than relying on Vercel's git integration.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

# Cancel an in-flight deploy when a newer commit lands on main.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate: only deploy when CI succeeded AND it was the main branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit CI validated, not the branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (prebuilt) for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
