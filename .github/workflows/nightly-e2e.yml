name: Nightly E2E

# Scheduled health check: runs the full Playwright suite against a fresh build
# every night so regressions surface even without a push. Also runnable on demand.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer builds + starts the app on port 3000.
      - run: npm run test:e2e
