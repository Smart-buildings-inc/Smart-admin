<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ATLAS OS — smart habitat emblem">
  <defs>
    <!-- Deep-space interior of the badge -->
    <radialGradient id="space" cx="42%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#1b2530"/>
      <stop offset="45%" stop-color="#0c131b"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>
    <!-- Brushed-chrome sheen for rings, skyline and rim -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#d7dee5"/>
      <stop offset="52%" stop-color="#8b96a2"/>
      <stop offset="68%" stop-color="#5a6470"/>
      <stop offset="86%" stop-color="#c3cbd3"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="40%" stop-color="#c2cbd4"/>
      <stop offset="60%" stop-color="#7e8893"/>
      <stop offset="100%" stop-color="#aeb8c2"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="42%" r="60%">
      <stop offset="82%" stop-color="#0a0f15"/>
      <stop offset="92%" stop-color="#2a333d"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge body -->
  <circle cx="256" cy="256" r="244" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="230" fill="url(#space)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#chrome)" stroke-width="11"/>
  <circle cx="256" cy="256" r="231" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Clip everything that follows to the inner disc -->
  <clipPath id="disc"><circle cx="256" cy="256" r="229"/></clipPath>
  <g clip-path="url(#disc)">

    <!-- Starfield -->
    <g fill="#ffffff">
      <circle cx="120" cy="120" r="2.2" opacity=".9"/>
      <circle cx="168" cy="92"  r="1.6" opacity=".7"/>
      <circle cx="96"  cy="190" r="1.8" opacity=".75"/>
      <circle cx="408" cy="150" r="2"   opacity=".85"/>
      <circle cx="360" cy="96"  r="1.5" opacity=".6"/>
      <circle cx="436" cy="232" r="1.7" opacity=".7"/>
      <circle cx="150" cy="412" r="1.8" opacity=".7"/>
      <circle cx="380" cy="396" r="2"   opacity=".8"/>
      <circle cx="300" cy="430" r="1.5" opacity=".6"/>
      <circle cx="86"  cy="300" r="1.6" opacity=".65"/>
      <circle cx="430" cy="330" r="1.6" opacity=".65"/>
      <circle cx="210" cy="70"  r="1.4" opacity=".6"/>
    </g>
    <!-- Four-point sparkles -->
    <g fill="url(#star)">
      <path d="M150 150 L153 168 L171 171 L153 174 L150 192 L147 174 L129 171 L147 168 Z"/>
      <path d="M392 200 L394 213 L407 215 L394 217 L392 230 L390 217 L377 215 L390 213 Z"/>
      <path d="M118 372 L120 384 L132 386 L120 388 L118 400 L116 388 L104 386 L116 384 Z"/>
    </g>

    <!-- Saturn-style orbital rings (behind the city) -->
    <g transform="rotate(-22 256 256)">
      <ellipse cx="256" cy="256" rx="248" ry="86" fill="none" stroke="#04070b" stroke-width="30" opacity="0.9"/>
      <ellipse cx="256" cy="256" rx="248" ry="86" fill="none" stroke="url(#chrome)" stroke-width="16"/>
      <ellipse cx="256" cy="256" rx="248" ry="86" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    </g>
    <g transform="rotate(28 256 256)">
      <ellipse cx="256" cy="256" rx="250" ry="70" fill="none" stroke="#04070b" stroke-width="24" opacity="0.85"/>
      <ellipse cx="256" cy="256" rx="250" ry="70" fill="none" stroke="url(#chrome)" stroke-width="11"/>
    </g>

    <!-- Skyline (chrome) sitting on the planet's front edge -->
    <g>
      <!-- left spire -->
      <rect x="160" y="196" width="26" height="150" fill="url(#chromeV)"/>
      <rect x="170" y="150" width="6" height="48" fill="url(#chromeV)"/>
      <!-- mid-left tower -->
      <rect x="190" y="234" width="34" height="112" fill="url(#chromeV)"/>
      <!-- central tower with antenna (wifi mast) -->
      <rect x="240" y="214" width="34" height="132" fill="url(#chromeV)"/>
      <rect x="254" y="178" width="6" height="40" fill="url(#chromeV)"/>
      <circle cx="257" cy="176" r="6" fill="url(#chromeV)"/>
      <!-- tallest block tower (right of centre) -->
      <rect x="288" y="186" width="46" height="160" fill="url(#chromeV)"/>
      <!-- right tower -->
      <rect x="340" y="240" width="32" height="106" fill="url(#chromeV)"/>

      <!-- Windows (punched dark) -->
      <g fill="#0a0f15" opacity="0.82">
        <rect x="197" y="246" width="20" height="6"/>
        <rect x="197" y="262" width="20" height="6"/>
        <rect x="197" y="278" width="20" height="6"/>
        <rect x="197" y="294" width="20" height="6"/>
        <rect x="197" y="310" width="20" height="6"/>

        <rect x="246" y="228" width="9" height="9"/>
        <rect x="259" y="228" width="9" height="9"/>
        <rect x="246" y="246" width="9" height="9"/>
        <rect x="259" y="246" width="9" height="9"/>
        <rect x="246" y="264" width="9" height="9"/>
        <rect x="259" y="264" width="9" height="9"/>
        <rect x="246" y="282" width="9" height="9"/>
        <rect x="259" y="282" width="9" height="9"/>
        <rect x="246" y="300" width="9" height="9"/>
        <rect x="259" y="300" width="9" height="9"/>

        <rect x="296" y="200" width="10" height="9"/>
        <rect x="312" y="200" width="10" height="9"/>
        <rect x="296" y="218" width="10" height="9"/>
        <rect x="312" y="218" width="10" height="9"/>
        <rect x="296" y="236" width="10" height="9"/>
        <rect x="312" y="236" width="10" height="9"/>
        <rect x="296" y="254" width="10" height="9"/>
        <rect x="312" y="254" width="10" height="9"/>
        <rect x="296" y="272" width="10" height="9"/>
        <rect x="312" y="272" width="10" height="9"/>
        <rect x="296" y="290" width="10" height="9"/>
        <rect x="312" y="290" width="10" height="9"/>
        <rect x="296" y="308" width="10" height="9"/>
        <rect x="312" y="308" width="10" height="9"/>

        <rect x="348" y="252" width="16" height="6"/>
        <rect x="348" y="268" width="16" height="6"/>
        <rect x="348" y="284" width="16" height="6"/>
        <rect x="348" y="300" width="16" height="6"/>
      </g>
    </g>

    <!-- Wi-Fi signal above the central mast -->
    <g fill="none" stroke="url(#chromeV)" stroke-linecap="round">
      <path d="M236 162 a30 30 0 0 1 42 0" stroke-width="7"/>
      <path d="M244 150 a18 18 0 0 1 26 0" stroke-width="7"/>
    </g>

    <!-- Circuit traces along the lower-left of the surface -->
    <g fill="none" stroke="url(#chrome)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 360 H188 l14 14 H236"/>
      <path d="M150 360 v22"/>
      <path d="M202 374 v18"/>
    </g>
    <g fill="url(#chrome)">
      <circle cx="120" cy="360" r="6"/>
      <circle cx="236" cy="374" r="6"/>
      <circle cx="150" cy="382" r="5"/>
      <circle cx="202" cy="392" r="5"/>
    </g>

    <!-- Front sweep of the primary ring crosses in front of the city base -->
    <g transform="rotate(-22 256 256)">
      <path d="M 36 286 A 248 86 0 0 0 476 286" fill="none" stroke="#04070b" stroke-width="30" opacity="0.9"/>
      <path d="M 36 286 A 248 86 0 0 0 476 286" fill="none" stroke="url(#chrome)" stroke-width="16"/>
      <path d="M 36 286 A 248 86 0 0 0 476 286" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    </g>
  </g>
</svg>
